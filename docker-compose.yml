name: headsup

services:
  redis:
    image: redis:7
    container_name: headsup-redis
    # `--aclfile` is what makes the single-writer rule survive a restart:
    # `hu bus acl apply` writes the compiler and agent users, and `ACL SAVE`
    # persists them into the named volume. Redis aborts startup if the file
    # does not exist, which it would not on a fresh volume, so create it
    # first. `exec` keeps redis as PID 1 so it still stops and restarts
    # cleanly.
    command:
      - sh
      - -c
      - touch /data/users.acl && exec redis-server --appendonly yes --aclfile /data/users.acl
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: headsup-postgis
    environment:
      POSTGRES_USER: headsup
      POSTGRES_PASSWORD: headsup
      POSTGRES_DB: headsup
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headsup -d headsup"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  postgis-data:
