[project]
name = "headsup"
version = "0.1.0"
description = "Neutral multi-agent layer turning public city signals into signed, expiring advisories for simulated robotaxi fleets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mridhul Sharma" }]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "redis>=5",
    "psycopg[binary]",
    "sqlalchemy",
    "geoalchemy2",
    "shapely",
    "pyproj",
    "h3",
    "osmnx",
    "python-igraph",
    "scikit-learn",
    "pynacl",
    "httpx",
    "anthropic",
    "ollama",
    "pyyaml",
    # The Austin signal feed stamps its rows in Austin local time with no
    # offset, so `zoneinfo` has to resolve America/Chicago. Windows has no
    # system tz database, and relying on this arriving behind psycopg would
    # make a five-hour timestamp error one dependency bump away.
    "tzdata",
    "typer",
    "rich",
    "orjson",
    # `hu eval` writes the ablation's three charts. A dependency of the
    # package rather than an extra: the eval is one of the things this
    # prototype is for, and a results directory with the table but not the
    # figures would be half an answer.
    "matplotlib",
]

[project.scripts]
hu = "headsup.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headsup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "llm: calls a real LLM API and spends money; never run in unit tests or CI",
    "integration: needs the Docker services from docker-compose.yml (Redis, PostGIS)",
    "e2e: runs a whole scenario end to end through bus, agents and simulator",
    "perf: measures wall-clock throughput on the dev laptop; meaningless on a shared runner",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "viz"]
# The God's Eye View fork is vendored with git subtree: third-party code held
# at upstream's style, not ours. Linting its maintainer scripts to our rules
# would only create churn against the next subtree pull.
extend-exclude = ["gev"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as call expressions in argument defaults; that is the
# framework's interface, not the mutable-default bug B008 looks for.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.uv]
package = true
