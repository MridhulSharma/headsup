# S2: downtown Austin signal blackout, 22 October 2026.
#
# GENERATED. Rebuild with:
#   uv run hu scenario synth-blackout --seed 7
#
# Unlike S1, this scenario's feed is not a recording of something that
# happened. The signal map under it is real - every signal id, intersection
# name and coordinate comes from the City of Austin inventory snapshot in
# data/signals/austin.json - but which signals are dark, and when, is
# invented here. That is what `scripted: true` tells the viewer to badge.

id: s2_blackout
name: Downtown Austin signal blackout
city: austin
hazard_class: SIGNAL_OUTAGE

# True because the signal states were generated. The God's Eye View labels
# any run of a scripted scenario.
scripted: true

# The one line the Test Scene launcher shows under the title.
what_if: >-
  What if a fleet treated a block of dark intersections as all-way stops
  instead of meeting them one vehicle at a time?

# Where the viewer puts the camera when this scene opens: the Congress Avenue
# grid the outage covers, looking north up the avenue.
start_view:
  lon: -97.7431
  lat: 30.2650
  height: 2200
  heading: 10
  pitch: -40

summary: >-
  A feeder failure drops 9 signals on the Congress Avenue grid into
  unscheduled flash during the Wednesday evening peak. The outage starts with
  3 intersections, which is one short of what the signal sentinel will
  publish; the rest follow five minutes later and the cluster holds for an
  hour before crews restore it in two steps. Every intersection in it is a
  real one, and together they cover the block grid a fleet crossing downtown
  cannot avoid.

window:
  start: 2026-10-22T00:30:00Z
  end: 2026-10-22T02:00:00Z
  duration_minutes: 90
  # The poll at which the cluster first reaches 4 signals, which is
  # the first one that can produce a candidate.
  first_candidate_at: 2026-10-22T00:45:00Z
  first_candidate_offset_seconds: 15

recording:
  fixture: data/recordings/s2_blackout/fixture/austin_signals.jsonl
  payloads: 19
  records: 207
  events: 207
  bytes: 78638
  feeds:
    austin_signals:
      payloads: 19
      events: 207

feeds:
  austin_signals:
    dataset: 5zpr-dehc
    poll_seconds: 300
    # Feed state codes, as the dataset documents them: 1 scheduled flash,
    # 2 and 7 unscheduled (conflict) flash, 3 communication issue.
    outage_state: 2
    # Minutes from `window.start`, and how many signals are dark after each.
    phases:
      - { at: 10, dark: 3, note: under the sentinel threshold }
      - { at: 15, dark: 9, note: one SIGNAL_OUTAGE candidate }
      - { at: 70, dark: 4, note: partly restored, still a cluster }
      - { at: 80, dark: 2, note: back under the threshold }
      - { at: 85, dark: 0, note: clear }
    cluster:
      centre: [-97.7431, 30.2686]
      radius_m: 400
      signals:
      - { signal_id: "303", name: '6TH ST / CONGRESS AVE' }
      - { signal_id: "293", name: '7TH ST / CONGRESS AVE' }
      - { signal_id: "314", name: '5TH ST / CONGRESS AVE' }
      - { signal_id: "284", name: '8TH ST / CONGRESS AVE' }
      - { signal_id: "304", name: '6TH ST / BRAZOS ST' }
      - { signal_id: "301", name: '6TH ST / LAVACA ST' }
      - { signal_id: "315", name: '5TH ST / BRAZOS ST' }
      - { signal_id: "282", name: '8TH ST / LAVACA ST' }
      - { signal_id: "959", name: 'COLORADO ST / 4TH ST' }
    # Flashing throughout, far enough out that DBSCAN at eps 400 m has to
    # label them noise rather than fold them into the cluster.
    noise_signals: ["1041", "133"]
    # Inside the cluster area and not part of it: one scheduled flash and two
    # communication issues. A sentinel that counted either would draw a
    # different hull.
    decoy_signals: ["316", "292", "288"]

expected:
  # What the signal sentinel should make of the recording.
  candidate_class: SIGNAL_OUTAGE
  candidate_severity: 3
  min_signals: 4
  eps_m: 400

replay:
  default_speed: 60
  streams: [events.austin_signals]

provenance:
  austin_signals:
    status: synthetic
    signal_map:
      status: real
      dataset: p53x-x73x
      source_url: https://data.austintexas.gov/resource/p53x-x73x.json
      retrieved_at: 2026-10-22
      snapshot: data/signals/austin.json
      signals_in_bbox: 182
    envelope: generated
    note: >-
      Signal ids, intersection names and coordinates are the City of Austin's
      own, taken from the Traffic Signals and Pedestrian Signals dataset and
      trimmed to the built Austin bbox. The operation states, their
      timestamps and the poll structure are generated by
      headsup.scenario.blackout from seed 7; the records carry the
      columns, state codes and naive Austin-local timestamps of the live
      Traffic Signals Status feed, so the same adapter parses both.
  generator:
    module: headsup.scenario.blackout
    command: hu scenario synth-blackout --seed 7
    seed: 7
