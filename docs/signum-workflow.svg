<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1330" viewBox="0 0 1040 1330"><rect width="1040" height="1330" fill="#FFFFFF"/><text x="60" y="54" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="bold" fill="#111827" text-anchor="start">Signum</text><text x="60" y="78" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="normal" fill="#5B6676" text-anchor="start">Public city signals become signed, expiring advisories any fleet can read</text><line x1="60" y1="96" x2="980" y2="96" stroke="#9AA6B5" stroke-width="1"/><rect x="812" y="128" width="188" height="1006" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="906.0" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#64748B" text-anchor="middle" letter-spacing="1.2">HASH-CHAINED</text><text x="906.0" y="178" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#64748B" text-anchor="middle" letter-spacing="1.2">AUDIT LOG</text><text x="906.0" y="212" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">Every candidate,</text><text x="906.0" y="231" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">hazard, proposal,</text><text x="906.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">verdict, compile</text><text x="906.0" y="269" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">result and ack is</text><text x="906.0" y="288" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">appended with</text><text x="906.0" y="307" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">sha256(prev + record).</text><text x="906.0" y="352" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">hu audit verify</text><text x="906.0" y="372" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">re-checks it line</text><text x="906.0" y="390" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">by line.</text><text x="906.0" y="436" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">Every figure in</text><text x="906.0" y="454" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">the evaluation was</text><text x="906.0" y="472" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">computed from</text><text x="906.0" y="490" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">these logs and</text><text x="906.0" y="508" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">nothing else.</text><rect x="268" y="128" width="504" height="92" rx="8" fill="#F6F8FA" stroke="#64748B" stroke-width="1.6"/><text x="520.0" y="156" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">PUBLIC FEEDS</text><rect x="291.0" y="172" width="110.0" height="30" rx="15" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="346.0" y="191" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">NWS alerts</text><rect x="407.0" y="172" width="110.0" height="30" rx="15" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="462.0" y="191" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">USGS gauges</text><rect x="523.0" y="172" width="110.0" height="30" rx="15" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="578.0" y="191" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">Austin signals</text><rect x="639.0" y="172" width="110.0" height="30" rx="15" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="694.0" y="191" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">Austin dispatch</text><text x="248" y="180" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">replayed 1–60×</text><line x1="520.0" y1="220" x2="520.0" y2="245" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 244 L 520.0 254 L 526.0 244 Z" fill="#9AA6B5"/><rect x="268" y="254" width="504" height="100" rx="8" fill="#EDF3FB" stroke="#2563EB" stroke-width="1.6"/><text x="520.0" y="281" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">SENTINELS</text><text x="520.0" y="300" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">one detector per hazard class</text><rect x="292.0" y="312" width="146.66666666666663" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/><text x="365.3333333333333" y="331" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="middle">Flood</text><rect x="446.66666666666663" y="312" width="146.66666666666663" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/><text x="520.0" y="331" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="middle">Signal outage</text><rect x="601.3333333333333" y="312" width="146.66666666666663" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/><text x="674.6666666666666" y="331" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="middle">Incident</text><text x="248" y="304" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">Haiku</text><text x="248" y="322" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">text → schema</text><line x1="520.0" y1="354" x2="520.0" y2="387" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 386 L 520.0 396 L 526.0 386 Z" fill="#9AA6B5"/><rect x="268" y="396" width="504" height="84" rx="8" fill="#EDF3FB" stroke="#2563EB" stroke-width="1.6"/><text x="520.0" y="424" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">FUSION</text><text x="520.0" y="445" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">noisy-OR confidence · evidence threshold</text><text x="520.0" y="464" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">narrows the hazard to the reach the evidence corroborates</text><text x="248" y="442" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">Sonnet</text><line x1="520.0" y1="480" x2="520.0" y2="513" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 512 L 520.0 522 L 526.0 512 Z" fill="#9AA6B5"/><rect x="268" y="522" width="504" height="74" rx="8" fill="#EDF3FB" stroke="#2563EB" stroke-width="1.6"/><text x="520.0" y="550" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">PROPOSER</text><text x="520.0" y="572" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">chooses an action from the playbook vocabulary only</text><text x="248" y="564" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">Sonnet</text><line x1="520.0" y1="596" x2="520.0" y2="629" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 628 L 520.0 638 L 526.0 628 Z" fill="#9AA6B5"/><rect x="268" y="638" width="504" height="84" rx="8" fill="#EDF3FB" stroke="#2563EB" stroke-width="1.6"/><text x="520.0" y="666" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">CRITIC</text><text x="520.0" y="687" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">sees the proposal and raw evidence,</text><text x="520.0" y="706" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">never the proposer's rationale</text><text x="248" y="676" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">Sonnet</text><text x="248" y="694" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">APPROVE /</text><text x="248" y="712" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">REVISE / ESCALATE</text><line x1="520.0" y1="722" x2="520.0" y2="755" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 754 L 520.0 764 L 526.0 754 Z" fill="#9AA6B5"/><rect x="268" y="764" width="504" height="112" rx="8" fill="#FDF4E3" stroke="#B45309" stroke-width="2.4"/><text x="520.0" y="792" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle" letter-spacing="0.8">COMPILER — THE DETERMINISTIC GATE</text><text x="520.0" y="814" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle">Not a model. Plain Python.</text><text x="520.0" y="836" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">action in the class playbook · area and lifetime caps · never isolates a hospital</text><text x="520.0" y="855" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">Ed25519 signature · single-writer Redis ACL: only the compiler may publish</text><rect x="36" y="772" width="208" height="96" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/><text x="140" y="798" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#B45309" text-anchor="middle" letter-spacing="0.6">HUMAN IN THE LOOP</text><text x="140" y="820" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">Severity 4+ or area over</text><text x="140" y="837" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">the two-key limit waits for</text><text x="140" y="854" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">an approval token.</text><line x1="244" y1="820" x2="258" y2="820" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/><path d="M 257 814 L 267 820 L 257 826 Z" fill="#B45309"/><line x1="520.0" y1="876" x2="520.0" y2="909" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 908 L 520.0 918 L 526.0 908 Z" fill="#9AA6B5"/><rect x="268" y="918" width="504" height="78" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="2.4"/><text x="520.0" y="948" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.2">SIGNED ADVISORY</text><text x="520.0" y="972" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#5B6676" text-anchor="middle">GeoJSON · action · area · valid_until · evidence · signature</text><text x="248" y="962" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">published once</text><line x1="520.0" y1="996" x2="520.0" y2="1029" stroke="#9AA6B5" stroke-width="2"/><path d="M 514.0 1028 L 520.0 1038 L 526.0 1028 Z" fill="#9AA6B5"/><rect x="268" y="1038" width="504" height="96" rx="8" fill="#F6F8FA" stroke="#64748B" stroke-width="1.6"/><text x="520.0" y="1065" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">FLEET OPERATORS</text><text x="520.0" y="1084" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">compliance stays the operator's call</text><rect x="292.0" y="1094" width="146.66666666666663" height="28" rx="14" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="365.3333333333333" y="1112" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#5B6676" text-anchor="middle">accepts at once</text><rect x="446.66666666666663" y="1094" width="146.66666666666663" height="28" rx="14" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="520.0" y="1112" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#5B6676" text-anchor="middle">accepts after 30–90 s</text><rect x="601.3333333333333" y="1094" width="146.66666666666663" height="28" rx="14" fill="#FFFFFF" stroke="#9AA6B5" stroke-width="1"/><text x="674.6666666666666" y="1112" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#5B6676" text-anchor="middle">declines below 0.7</text><text x="248" y="1090" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">every fleet,</text><text x="248" y="1108" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">one integration</text><path d="M 772 1086 L 798 1086" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/><path d="M 797 1080 L 807 1086 L 797 1092 Z" fill="#64748B"/><text x="792.0" y="1078" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#5B6676" text-anchor="middle">acks</text><rect x="268" y="1168" width="504" height="78" rx="8" fill="#EDF3FB" stroke="#2563EB" stroke-width="1.6"/><text x="520.0" y="1196" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" letter-spacing="1.4">SURGE TRIAGE</text><text x="520.0" y="1220" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="middle">clusters remote-assist requests into a handful of decisions</text><text x="248" y="1212" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">Haiku</text><line x1="520.0" y1="1134" x2="520.0" y2="1159" stroke="#9AA6B5" stroke-width="2" stroke-dasharray="4 3"/><path d="M 514.0 1158 L 520.0 1168 L 526.0 1158 Z" fill="#9AA6B5"/><text x="616.0" y="1154" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#5B6676" text-anchor="middle">stalled vehicles</text><rect x="60" y="1264" width="22" height="16" rx="4" fill="#EDF3FB" stroke="#2563EB" stroke-width="1.4"/><text x="90" y="1277" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="start">Model in the loop (proposes)</text><rect x="360" y="1264" width="22" height="16" rx="4" fill="#FDF4E3" stroke="#B45309" stroke-width="1.4"/><text x="390" y="1277" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="start">Deterministic gate (disposes)</text><rect x="660" y="1264" width="22" height="16" rx="4" fill="#F6F8FA" stroke="#64748B" stroke-width="1.4"/><text x="690" y="1277" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="start">No model</text><text x="980" y="1277" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#5B6676" text-anchor="end">Feed text is data, never an instruction.</text></svg>